<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POLIPONI BALI 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f4f6fb;
color:#111;
}

/* HEADER */

.header{
height:75px;
background:#0038d9;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 25px;
position:sticky;
top:0;
z-index:999;
}

.logo{
font-size:30px;
font-weight:800;
color:white;
}

.header-right{
display:flex;
gap:12px;
}

.circle{
width:42px;
height:42px;
border-radius:50%;
background:rgba(255,255,255,.15);
display:flex;
align-items:center;
justify-content:center;
color:white;
font-weight:700;
}

/* BANNER */

.banner{
width:100%;
height:330px;
overflow:hidden;
}

.banner img{
width:100%;
height:100%;
object-fit:cover;
}

/* CONTAINER */

.container{
max-width:1450px;
margin:auto;
padding:25px;
}

/* STEPS */

.steps{
display:flex;
gap:12px;
margin-bottom:25px;
flex-wrap:wrap;
}

.step{
flex:1;
min-width:120px;
background:white;
padding:14px;
border-radius:14px;
font-weight:600;
text-align:center;
border:2px solid #e9e9e9;
}

.step.active{
background:#0038d9;
color:white;
border-color:#0038d9;
}

/* GRID */

.grid{
display:grid;
grid-template-columns:1fr 1fr 350px;
gap:20px;
align-items:start;
}

/* CARD */

.card{
background:white;
border-radius:24px;
padding:24px;
box-shadow:0 8px 25px rgba(0,0,0,.05);
}

.card-title{
font-size:22px;
font-weight:700;
margin-bottom:22px;
color:#0038d9;
}

/* INPUT */

.input-group{
margin-bottom:18px;
}

.input-group label{
display:block;
margin-bottom:8px;
font-weight:600;
}

.input-group input,
.input-group select{
width:100%;
height:54px;
border-radius:14px;
border:1px solid #ddd;
padding:0 16px;
font-size:15px;
outline:none;
}

.input-group input:focus,
.input-group select:focus{
border-color:#0038d9;
}

/* SUMMARY */

.summary-line{
display:flex;
justify-content:space-between;
margin-bottom:14px;
font-size:15px;
}

.total{
font-size:32px;
font-weight:800;
margin-top:18px;
color:#0038d9;
}

/* BUTTON */

.btn{
width:100%;
height:58px;
border:none;
border-radius:16px;
background:#0038d9;
color:white;
font-size:17px;
font-weight:700;
cursor:pointer;
transition:.3s;
margin-top:20px;
}

.btn:hover{
transform:translateY(-2px);
}

/* ========================= */
/* PAYMENT PAGE NEW DESIGN */
/* ========================= */

.payment-page{
display:none;
padding:20px;
max-width:760px;
margin:40px auto;
background:#f7f7f7;
border-radius:30px;
box-shadow:0 10px 35px rgba(0,0,0,.08);
border:4px solid #000;
position:relative;
overflow:hidden;
}

.payment-head{
background:white;
border:4px solid #000;
padding:22px;
border-radius:24px;
margin-bottom:20px;
position:relative;
overflow:hidden;
box-shadow:12px 12px 0 #000;
}

.payment-head::before{
content:'POLIPONI';
position:absolute;
top:12px;
left:20px;
font-size:40px;
font-weight:900;
letter-spacing:3px;
color:#111;
opacity:.08;
}

.payment-head h2{
font-size:38px;
font-weight:900;
line-height:1;
margin-bottom:8px;
color:#ff0000;
text-transform:uppercase;
text-shadow:4px 4px 0 #000;
}

.payment-head p{
font-size:15px;
font-weight:700;
color:#111;
}

.payment-method{
display:flex;
gap:14px;
margin-bottom:22px;
}

.pay-box{
flex:1;
padding:16px;
border-radius:18px;
border:4px solid #000;
text-align:center;
font-weight:900;
font-size:16px;
background:#ffe600;
box-shadow:8px 8px 0 #000;
}

.timer{
font-size:54px;
font-weight:900;
text-align:center;
color:#ff0000;
margin-bottom:25px;
text-shadow:3px 3px 0 #000;
}

.qris-banner{
background:#ffffff;
padding:25px;
border-radius:28px;
border:4px solid #000;
margin-bottom:25px;
position:relative;
overflow:hidden;
box-shadow:14px 14px 0 #000;
}

.qris-top{
display:flex;
gap:6px;
margin-bottom:18px;
}

.color-box{
width:35px;
height:35px;
border:3px solid #000;
}

.red{
background:#ff0000;
}

.yellow{
background:#ffd400;
}

.blue{
background:#00d9ff;
}

.green{
background:#00d63b;
}

.qris-title{
font-size:42px;
font-weight:900;
line-height:1;
text-transform:uppercase;
margin-bottom:10px;
color:#111;
}

.qris-sub{
background:#ff0000;
display:inline-block;
padding:10px 18px;
font-size:26px;
font-weight:900;
color:white;
border:4px solid #000;
box-shadow:6px 6px 0 #000;
margin-bottom:20px;
}

.qris-box{
background:white;
padding:20px;
border-radius:24px;
border:4px solid #000;
text-align:center;
margin-bottom:20px;
}

.qris-box img{
width:100%;
max-width:280px;
}

.payment-total-box{
background:#ffe600;
padding:18px;
border-radius:20px;
border:4px solid #000;
display:flex;
justify-content:space-between;
align-items:center;
font-weight:900;
font-size:22px;
margin-bottom:22px;
box-shadow:8px 8px 0 #000;
}

.upload-box{
border:4px dashed #000;
border-radius:24px;
padding:28px;
background:white;
text-align:center;
margin-top:15px;
position:relative;
}

.upload-box label{
display:block;
font-size:20px;
font-weight:900;
margin-bottom:15px;
}

.upload-box input{
width:100%;
padding:14px;
border-radius:14px;
border:2px solid #000;
background:#f5f5f5;
font-weight:700;
}

.check-area{
display:flex;
align-items:flex-start;
gap:12px;
margin-top:22px;
font-size:14px;
background:white;
padding:18px;
border-radius:20px;
border:3px solid #000;
}

.check-area input{
margin-top:4px;
transform:scale(1.3);
}

.payment-btn{
width:100%;
height:64px;
border:none;
border-radius:22px;
background:#ff0000;
color:white;
font-size:19px;
font-weight:900;
cursor:pointer;
transition:.3s;
margin-top:25px;
border:4px solid #000;
box-shadow:10px 10px 0 #000;
}

.payment-btn:hover{
transform:translateY(-3px);
}

/* LOADING */

.loading-page{
display:none;
position:fixed;
inset:0;
background:white;
z-index:999999;
align-items:center;
justify-content:center;
flex-direction:column;
text-align:center;
padding:20px;
}

.loader{
width:95px;
height:95px;
border:8px solid #eee;
border-top:8px solid #0038d9;
border-radius:50%;
animation:spin 1s linear infinite;
margin-bottom:30px;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

.loading-page h1{
font-size:34px;
margin-bottom:10px;
}

.loading-page p{
font-size:16px;
color:#666;
}

/* FAILED */

.failed-page{
display:none;
min-height:100vh;
background:white;
align-items:center;
justify-content:center;
flex-direction:column;
text-align:center;
padding:20px;
}

.failed-icon{
width:140px;
height:140px;
border-radius:50%;
background:#ffeded;
display:flex;
align-items:center;
justify-content:center;
font-size:70px;
color:#ff2a2a;
margin-bottom:25px;
animation:pop .5s ease;
}

@keyframes pop{
0%{
transform:scale(.5);
opacity:0;
}
100%{
transform:scale(1);
opacity:1;
}
}

.failed-page h1{
font-size:42px;
margin-bottom:10px;
color:#111;
}

.failed-page p{
font-size:17px;
color:#666;
margin-bottom:30px;
max-width:500px;
}

.redirect-btn{
padding:16px 30px;
background:#0038d9;
color:white;
border-radius:16px;
text-decoration:none;
font-weight:700;
}

/* MOBILE */

@media(max-width:1100px){

.grid{
grid-template-columns:1fr;
}

.banner{
height:220px;
}

}

@media(max-width:700px){

.payment-head h2{
font-size:28px;
}

.qris-title{
font-size:30px;
}

.qris-sub{
font-size:18px;
}

.timer{
font-size:42px;
}

.payment-total-box{
font-size:17px;
flex-direction:column;
gap:10px;
}

}

</style>
</head>
<body>

<!-- HEADER -->

<div class="header">
<div class="logo">POLIPONI</div>

<div class="header-right">
<div class="circle">ID</div>
<div class="circle">☰</div>
</div>
</div>

<!-- BANNER -->

<div class="banner">
<img src="banner.png">
</div>
